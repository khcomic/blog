{{ define "main" }}
<div class="container pt-3">
  <div class="row">
    <div class="col-md-12">
      <h2>搜尋</h2>
      <input type="text" id="search-input" placeholder="輸入關鍵字搜尋…" class="form-control mb-3">
      <div id="search-results"></div>
    </div>
  </div>
</div>

<style>
  .search-result {
    padding: 0.75rem 0;
    border-bottom: 1px solid #eee;
  }
  .search-result h3 {
    margin: 0 0 0.25rem 0;
    font-size: 1.1rem;
  }
  .search-result p {
    margin: 0;
    color: #555;
  }
  .search-result mark {
    background: #fff2a8;
    padding: 0 1px;
  }
</style>

<script type="module">
  const input = document.getElementById("search-input");
  const resultsEl = document.getElementById("search-results");
  let debounceTimer;
  let indexData = null;
  let indexLoading = null;

  async function loadIndex() {
    if (indexData) return indexData;
    if (!indexLoading) {
      indexLoading = fetch("/posts/index.json")
        .then(res => res.json())
        .then(data => { indexData = data; return data; });
    }
    return indexLoading;
  }

  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => runSearch(input.value.trim()), 300);
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function highlight(text, query) {
    const safe = escapeHtml(text);
    const safeQuery = escapeHtml(query);
    if (!safeQuery) return safe;
    return safe.split(safeQuery).join(`<mark>${safeQuery}</mark>`);
  }

  async function runSearch(query) {
    resultsEl.innerHTML = "";
    if (!query) return;

    resultsEl.innerHTML = "<p>搜尋中…</p>";
    const data = await loadIndex();

    // 只比對標題，不比對內文
    const filtered = data.filter(p => p.title.includes(query));

    resultsEl.innerHTML = "";

    if (filtered.length === 0) {
      resultsEl.innerHTML = "<p>找不到符合的結果。</p>";
      return;
    }

    for (const p of filtered) {
      const item = document.createElement("div");
      item.className = "search-result";
      item.innerHTML = `
        <h3><a href="${p.url}">${highlight(p.title, query)}</a></h3>
        <p>${escapeHtml(p.excerpt)}</p>
      `;
      resultsEl.appendChild(item);
    }
  }
</script>
{{ end }}
